name: Reusable Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 签出代码
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 配置 uv 
      - name: Setup UV for Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.8"
          python-version: "3.14.7"
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      - name: Install Python 3.14.7
        run: uv python install 3.14.7

      # 安装依赖
      - name: Install dependencies
        run: |
          uv sync --frozen --python 3.14.7

      - name: Setup Rust 1.99.1
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install Native Shell 0.5.0
        shell: pwsh
        env:
          NSH_VERSION: v0.5.0
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          nsh --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: nsh-app/native

      - name: Run backend and Native Shell tests
        env:
          AHAB_BACKEND: mock
        run: |
          uv run pytest -q
          uv run python scripts/check_upstream_boundary.py
          cargo fmt --manifest-path nsh-app/native/Cargo.toml -- --check
          cargo check --manifest-path nsh-app/native/Cargo.toml --all-targets
          cargo clippy --manifest-path nsh-app/native/Cargo.toml --all-targets -- -D warnings
          nsh check nsh-app
          nsh test nsh-app
      
      # 构建并打包程序
      - name: build & bundle
        env:
          # The updater verifies manifests with the public key bundled into
          # the package. Keep this input separate from the signing step so a
          # signed build can never ship without its verification key.
          AALC_UPDATE_PUBLIC_KEYS: ${{ secrets.AALC_UPDATE_PUBLIC_KEYS }}
        run: |
          uv run python ./scripts/build.py --version ${{ inputs.version }}

      - name: Smoke-test frozen sidecar
        run: uv run python ./scripts/smoke_frozen_sidecar.py "dist/AALC.nsh/backend/AALC Backend.exe"

      - name: Detect signed update metadata
        id: signing
        shell: pwsh
        env:
          AALC_UPDATE_SIGNING_KEY: ${{ secrets.AALC_UPDATE_SIGNING_KEY }}
          AALC_UPDATE_PUBLIC_KEYS: ${{ secrets.AALC_UPDATE_PUBLIC_KEYS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AALC_UPDATE_SIGNING_KEY) -or [string]::IsNullOrWhiteSpace($env:AALC_UPDATE_PUBLIC_KEYS)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Sign update manifest
        if: steps.signing.outputs.enabled == 'true'
        env:
          AALC_UPDATE_SIGNING_KEY: ${{ secrets.AALC_UPDATE_SIGNING_KEY }}
          AALC_UPDATE_PUBLIC_KEYS: ${{ secrets.AALC_UPDATE_PUBLIC_KEYS }}
        run: |
          uv run python ./scripts/sign_update_manifest.py --archive "dist/AALC.nsh_${{ inputs.version }}.7z" --manifest "dist/AALC.nsh_${{ inputs.version }}.manifest.json" --signature "dist/AALC.nsh_${{ inputs.version }}.manifest.sig" --version "${{ inputs.version }}"

      # 上传打包结果
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AALC.nsh_${{ inputs.version }}
          path: dist/AALC.nsh_${{ inputs.version }}.7z
          if-no-files-found: error

      - name: Upload signed update metadata
        if: steps.signing.outputs.enabled == 'true'
        env:
          AALC_UPDATE_SIGNING_KEY: ${{ secrets.AALC_UPDATE_SIGNING_KEY }}
          AALC_UPDATE_PUBLIC_KEYS: ${{ secrets.AALC_UPDATE_PUBLIC_KEYS }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AALC.nsh_${{ inputs.version }}_signature
          path: |
            dist/AALC.nsh_${{ inputs.version }}.manifest.json
            dist/AALC.nsh_${{ inputs.version }}.manifest.sig
          if-no-files-found: error

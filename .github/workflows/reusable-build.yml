name: Reusable Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 签出代码
      - name: Checkout
        uses: actions/checkout@main

      # 配置 uv 
      - name: Setup UV for Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      # 安装依赖
      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui-app

      - name: Run backend and GPUI tests
        run: |
          uv run pytest -q
          cargo +nightly fmt --manifest-path gpui-app/Cargo.toml -- --check
          cargo +nightly test --manifest-path gpui-app/Cargo.toml
      
      # 构建并打包程序
      - name: build & bundle
        run: |
          uv run python ./scripts/build.py --version ${{ inputs.version }}

      # 上传打包结果
      - name: Upload build artifacts
        uses: actions/upload-artifact@main
        with:
          name: AALC_${{ inputs.version }}
          path: |
            dist/AALC_${{ inputs.version }}.7z
            dist/AALC_${{ inputs.version }}.zip
          archive: false

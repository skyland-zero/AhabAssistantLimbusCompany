upstream_remote = "origin"
upstream_branch = "main"

# These directories are regularly replaced by upstream changes. New direct
# edits must be added to the explicit allowlist with a merge rationale.
protected_prefixes = [
    "module/automation/",
    "module/config/",
    "module/game_and_screen/",
    "tasks/",
    "utils/",
]

# The product intentionally removes the Qt desktop layer. Modify/delete
# conflicts below this prefix are expected during an upstream sync.
expected_deleted_prefixes = ["app/"]

allowed_protected_files = [
    # Ruff lint/format cleanup for the public automation exports and input path.
    "module/automation/__init__.py",

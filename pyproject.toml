[project]
name = "ahab-assistant-limbus-company"
description = "Ahab Assistant for Limbus Company: GPUI frontend, Python automation and OCR sidecar."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "KIYI671" }]
keywords = ["limbus", "automation", "gpui", "ocr", "game-assistant"]
requires-python = ">=3.14,<3.15"
version = "1.0.9"

dependencies = [
    "pywin32",
    "PyAutoGUI",
    "pynput",
    "pyperclip",
    "playsound3",
    "requests",
    "packaging",
    "markdown-it-py",
    "mdit-py-plugins",
    "linkify-it-py",
    "ruamel.yaml",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "psutil",
    "onnxruntime==1.29.0",
    "concurrent-log-handler>=0.9.28",
    "colorlog>=6.9.0",
    "rapidocr>=3.4.1",
    "tzdata>=2025.2",
    "adbutils>=2.10.2",
    "windows-toasts>=1.3.1",
    "pydantic>=2.12.5",
    "websockets>=15.0",
    "cryptography>=42.0",
    "av>=14.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=9.1.0",
    "ruff>=0.13.1",
]

[project.urls]
Homepage = "https://github.com/KIYI671/AhabAssistantLimbusCompany"
Source = "https://github.com/KIYI671/AhabAssistantLimbusCompany"
Issues = "https://github.com/KIYI671/AhabAssistantLimbusCompany/issues"

[tool.uv]
managed = true
required-version = ">=0.12.8"
# RapidOCR only needs the cv2 module; use the headless distribution for this backend.
override-dependencies = ["opencv-python; python_version < '0'"]

[tool.ruff.lint]
# 启用规则集 (E: pycodestyle, F: Pyflakes, I: isort)
# T201: 禁止使用print进行调试
select = ["E", "F", "I", "T201"]
# 忽略特定的规则
ignore = ["E501"]
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[package]
name = "ahab-gpui-app"
version = "0.1.0"
edition = "2024"
publish = false

# GPUI Kit pins GPUI itself: the framework now ships as the `gpui-pre-*`
# crates.io snapshot family, and `gpui-component` links the very same
# `=0.3.6` release. The app renames the packages to `gpui` / `gpui_platform`
# so both sides resolve to one set of GPUI types instead of two copies.
#
# All three `=0.3.6` pins move together; `gpui-component` will not accept a
# different `gpui-pre`, so bumping one requires bumping all of them at once.
[dependencies]
async-channel = "2"
# Local wall-clock formatting for run timestamps (chrono is already in the
# GPUI dependency tree; the clock feature provides the local timezone).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = { version = "=0.3.6", package = "gpui-pre" }
gpui_platform = { version = "=0.3.6", package = "gpui-pre-platform" }
gpui-component = "=0.6.6"
gpui-component-assets = { version = "=0.6.6", package = "gpui-kit-assets" }
image = { version = "0.25.10", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
tungstenite = "0.27"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

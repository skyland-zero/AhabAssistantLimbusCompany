[package]
name = "ahab-gpui-app"
version = "0.1.0"
edition = "2024"
publish = false

# This app intentionally follows the latest GPUI source on GitHub instead of a
# crates.io release. Cargo.lock records the exact commit used for each build.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
tungstenite = "0.27"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

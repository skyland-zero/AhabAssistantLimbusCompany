[package]
name = "ahab-gpui-app"
version = "0.1.0"
edition = "2024"
publish = false

# GPUI Kit's facade pins the matching GPUI snapshot and re-exports every layer
# the app uses: GPUI at the crate root, `platform`, `base`, `component` and
# `assets`. One dependency keeps those versions aligned; `gpui-kit` internally
# requires the exact `gpui-pre` snapshot its component layer was built against.
[dependencies]
async-channel = "2"
# Local wall-clock formatting for run timestamps (chrono is already in the
# GPUI dependency tree; the clock feature provides the local timezone).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.4"
gpui-kit = "=0.8.0"
image = { version = "0.25.10", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
tungstenite = "0.27"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

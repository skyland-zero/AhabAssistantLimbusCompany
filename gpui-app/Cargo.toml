[package]
name = "ahab-gpui-app"
version = "0.1.0"
edition = "2024"
publish = false

# GPUI is pinned in the manifest as well as Cargo.lock so a lock regeneration
# cannot silently move the UI framework.
[dependencies]
async-channel = "2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8", package = "gpui_platform", default-features = false }
image = { version = "0.25.10", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
tungstenite = "0.27"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[package]
name = "aalc-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "AALC's Native Shell backend: RPC transport, execution state and domain models."

# The app crate is the root of its own workspace, closed to the repository's
# other Cargo projects: `nsh` links only this package into the hosts it builds
# (nsh.json `"rust": "native"`). The two crates it builds on are members, so
# one `cargo test`/`cargo clippy --workspace` covers the whole Rust side while
# `nsh` still sees a single app crate.
[workspace]
members = ["crates/contract", "crates/model"]

[dependencies]
# The external contract (and the deterministic mock) are serde JSON payloads.
# `aalc-contract` holds the envelopes and names, `aalc-model` the payloads; both
# are re-exported below as `ipc::contract` and `model`.
aalc-contract = { path = "crates/contract" }
aalc-model = { path = "crates/model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking WebSocket for the loopback Python sidecar. The transport runs on its
# own thread; TSX calls reach it through an async class method that uses
# `nsh`'s `blocking` helper.
getrandom = "0.4"
tungstenite = "0.28"
nsh-core = "0.5.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
# No crate-level UI tests yet: the headless `App.test.tsx` runs through the
# `nsh test` CLI, which builds its own host. Re-add `nsh-testing` +
# `nsh-engine` (and `nsh-core` with `declarations`) when P1 adds Rust tests
# that drive `App.tsx` against this crate's set — see
# examples/rust-exports/native/tests in the NSH repository.

[lints.rust]
unsafe_code = "deny"
